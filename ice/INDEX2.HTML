<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iceberg Scrolling Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            /* background-color: #050b14; */
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Fixed Iceberg Background */
        .iceberg-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            /* background: linear-gradient(to bottom, #4a90e2 0%, #1c3b57 30%, #0a192f 70%, #02060c 100%); */
            /* You can add an actual iceberg image background here: */
             background-image: url("images/iceberg.jpg");
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: filter 0.3s ease;
        }

        /* Container for sections */
        .container {
            position: relative;
            width: 100%;
        }

        /* Individual Iceberg Tier Section */
        .tier-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .tier-title {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .main-heading {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Specific section styling to match depth */
        .tier-section:nth-child(n+4) {
            background: rgba(0, 0, 0, 0.3);
        }
        
        .tier-section:nth-child(n+7) {
            background: rgba(0, 0, 0, 0.6);
        }



        /* Change this from fixed to absolute so it scrolls with the page */
        .iceberg-bg {
            position: absolute; /* Changed from fixed */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; /* Changed from 100vh to cover the full document */
            background: linear-gradient(to bottom, #4a90e2 0%, #1c3b57 30%, #0a192f 70%, #02060c 100%);
            background-size: cover;
            background-position: center;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="iceberg-bg" id="icebergBg"></div>

    <div class="container">
        <h1 class="main-heading" id="mainTitle">Iceberg</h1>

        <section class="tier-section">
            <div class="tier-title">Popular</div>
            <div class="tier-title">Surface</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Surface</div>
            <div class="tier-title">Somewhat Known</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Somewhat Known</div>
            <div class="tier-title">Under Water</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Under Water</div>
            <div class="tier-title">Deep Down</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Deep Down</div>
            <div class="tier-title">Serious</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Serious</div>
            <div class="tier-title">Deep Down</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Deep Down</div>
            <div class="tier-title">Dark Site</div>
        </section>

        <section class="tier-section">
            <div class="tier-title">Dark Site</div>
            <div class="tier-title">Unknown</div>
        </section>

        <section class="tier-section" style="background: #000000;">
            <div class="tier-title">Unknown</div>
            <div class="tier-title"></div>
        </section>
    </div>

    <script>
        // Optional JavaScript to darken the background progressively as you scroll down
        window.addEventListener('scroll', () => {
            const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
            const currentScroll = window.scrollY;
            const scrollProgress = currentScroll / scrollTotal;

            const bg = document.getElementById('icebergBg');
            const mainTitle = document.getElementById('mainTitle');

            // Hide main title after scrolling past the first screen
            if (currentScroll > window.innerHeight / 2) {
                mainTitle.style.opacity = Math.max(0, 1 - (currentScroll - window.innerHeight / 2) / 200);
            } else {
                mainTitle.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
